#   v27（当前，v2.0.0-beta.4 修复）：
#     - **Android 编译在 cargokit 原生构建任务必挂**：`:irondash_engine_context:
#       cargokitCargoBuild…` 报 `Could not find method exec()`。根因是 Gradle 9 移除了
#       `Project.exec(...)` 整个方法（不止 Closure 重载，Action 重载也没有了），而 irondash 0.5.5
#       自带的 cargokit（gradle/plugin.gradle 第 60/65 行）仍用 `project.exec { … }` 闭包；
#       本地能过只是因为 Rust 产物已缓存、该 task 被跳过（UP-TO-DATE），CI 为 clean 构建必跑到这行。
#     - **第一版补丁没生效的坑**：glob 写成精确的 `cargokit`（路径段必须正好叫 cargokit），
#       但 pub 缓存里的目录实为 `cargokit-<版本号>`，所以一个都没匹配到、静默「跳过」，
#       Gradle 9 下照样崩。修正为 `cargokit*`，并加上「找不到 / 打不上就 sys.exit(1) 显式失败」
#       的防静默逻辑（避免上游改结构后在 Gradle 深处报一个看不懂的错）。
#     - **第二版补丁仍漏改关键块的坑**：第 65 行那处真正执行 cargo 构建的 exec 块里含 GString
#       `"${buildDir}/build_tool"`，其 `{ }` 花括号让只认 `[^{}]*` 的正则提前断裂、整个块匹配失败，
#       结果只改了第 60 行的 chmod 块、构建块仍是 Gradle 9 不支持的闭包写法 → 照挂。修正为先用
#       `\x00…\x00` 占位符屏蔽 `${...}` 再匹配、匹配完还原。
#     - **第三版方向仍错**：把 `project.exec { … }` 改写成 `project.exec { spec -> … }`（Groovy
#       SAM 闭包）仍失败——因为方法 `Project.exec` 本身已被 Gradle 9 移除，只是换个闭包写法照样
#       调用不存在的方法。正确替代是 Gradle 8.1+ 的 `ProviderFactory.exec`，即 `project.providers.exec
#       { spec -> … }`；且脚本插件 classpath 不含 Gradle API 类，故不能用 `new Action<ExecSpec>()`
#       显式类型引用（会报 unable to resolve class），只能靠 SAM 闭包让 spec 类型由方法签名推断。
#     - **第四版（最终）补上惰性 Provider 的坑**：`project.providers.exec { … }` 只创建 ExecSpec、
#       返回一个**惰性 Provider**，命令并不会真正执行——cargokit 任务会"成功"但零产出（Rust .so
#       从未编译），APK 因此缺 `libirondash_engine_context_native.so`，运行时 `System.loadLibrary`
#       抛 `UnsatisfiedLinkError` 白屏秒退。最终写法是 `project.providers.exec { spec -> … }.result.get()`，
#       用 `.result.get()` 消费 Provider、强制同步执行并等待命令完成。补丁兼容三态（原始
#       `project.exec`、旧 `project.exec { spec ->`、上一版 `project.providers.exec { spec ->`），
#       幂等判定也收紧为检测 `.result.get()`，免得旧的错误产物被跳过。
#     - **移除条件**：irondash 发布 Gradle 9 兼容版（cargokit 改用 `project.providers.exec { … }.result.get()`）后，本步可删除。
