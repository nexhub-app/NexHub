#       结果是同一版本在 Release 列表里出现两个条目（一个只有 HAP、一个没有 HAP）。
#       现改为：**任何 v* 标签都构建全部平台**，Android/Windows/Linux/macOS/iOS 与鸿蒙 HAP
#       全部落到同一个 Release 页面；鸿蒙工作流（build_ohos.yml）只负责并行编译 + 追加产物，
#       不再有「鸿蒙独占发布」的概念。
#     - **发版纪律**：一个版本只打一个标签（如 `v3.1.2` / `v3.1.2-beta.1`），
#       **不再使用 `-ohos` 后缀标签**；鸿蒙产物不再单独发版。
# =============================================================================

name: Build & Release NexHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - name: 获取依赖
        run: flutter pub get 2>&1
      - name: 修补插件 proguard 配置以兼容 AGP 9
        # AGP 9.0 起彻底移除了 getDefaultProguardFile('proguard-android.txt')，
        # 仍调用它的旧插件（如 flutter_inappwebview_android 1.1.3，官方 issue #2852 未发版修复）
        # 会在评估期直接 FAILURE。这里在构建前把 pub 缓存里所有插件 android/build.gradle 中的
        # proguard-android.txt 替换为官方推荐的 proguard-android-optimize.txt。
        # 仅改 pub 缓存，不触碰仓库源码；应用 release 已关闭 minify，库模块行为不受影响。
        shell: bash
        run: |
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          count=0
          while IFS= read -r f; do
            if grep -q "proguard-android\.txt" "$f"; then
              sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$f"
              echo "patched: $f"
              count=$((count+1))
            fi
          done < <(find "$PUB_CACHE_DIR" -path '*/android/build.gradle' 2>/dev/null)
          if [ "$count" -eq 0 ]; then
            echo "未发现需要修补的 proguard-android.txt（插件可能已兼容 AGP 9），跳过"
          else
            echo "共修补 $count 个插件 build.gradle"
          fi
      - name: 修补 cargokit exec 调用以兼容 Gradle 9
        # Gradle 9 移除了 Project.exec(...) 方法本身（不止 Closure 重载，Action 重载也没有了），
        # irondash 0.5.5 自带的 cargokit (gradle/plugin.gradle) 仍用 project.exec { ... }，
        # 执行期必报 "Could not find method exec()"。Gradle 8.1+ 的替代是
        # ProviderFactory.exec，即 project.providers.exec { spec -> spec.xxx }。
        # 注意1：之前一版补丁只把 project.exec { 改成 project.exec { spec ->，方向错了——
        #   方法本身已不存在，构建照样失败；必须替换为 project.providers.exec。
        # 注意2（关键坑）：providers.exec 返回的是**惰性 Provider**，仅创建 ExecSpec 不会
        #   真正执行命令！必须补 `.result.get()` 消费 Provider 才会运行 run_build_tool.sh
        #   下载/编译 Rust .so。只换 providers.exec 而不 get() 会让 cargokit 任务"成功"但
        #   零产出（Gradle 日志：Task has not declared any outputs）、APK 缺 irondash .so、
        #   运行时 UnsatisfiedLinkError 白屏秒退。此前一版正是栽在这里。
        # 关键：plugin.gradle 作为脚本插件，其编译 classpath 不含 Gradle API 类，
        # 故不能用 new Action<ExecSpec>() 这种显式类型引用（会报 unable to resolve class），
        # 只能靠 Groovy 对 providers.exec(Action) 的 SAM 闭包适配（spec 类型由参数推断）。
        # 仅改 pub 缓存，不触碰仓库源码；irondash 发布修复后可移除本步。
        shell: bash
        run: |
          set -euo pipefail
          export PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          python3 - <<'PY'
          import glob, os, re, sys
          patched = 0
          found = 0
          pub_cache_dir = os.environ.get('PUB_CACHE_DIR') or os.environ.get('PUB_CACHE') or os.path.expanduser('~/.pub-cache')
          # 注意：pub 缓存里目录名为 cargokit-<版本号>（如 cargokit-1.5.1），
          # 不能用精确的 'cargokit'，否则 glob 匹配不到任何文件、静默跳过。
          # 第二处 exec 块里含 GString "${buildDir}"，其 { } 花括号会让只认 [^{}]* 的正则
          # 在匹配时提前断裂，导致该关键构建块漏改、Gradle 9 下照挂。故先用占位符屏蔽
          # ${...} 再匹配，匹配后还原。
          # 匹配 project.exec { ... } 或 project.providers.exec { ... }（兼容历版补丁残留）：
          # 统一改写为 project.providers.exec { spec -> ... }.result.get()（result.get() 消费惰性
          # Provider，真正执行命令）。(?!\s*\.result) 防重复追加。(?!spec\b) 分支兼容已带 spec 的旧产物。
          pattern = re.compile(r'project(?:\.providers)?\.exec\s*\{(?!\s*\.result)([^{}]*)\}(?!\s*\.result)', re.S)
          method_re = re.compile(r'^(\s+)(commandLine|executable|args|environment|workingDir|standardOutput|errorOutput|ignoreExitValue|standardInput|setStandardOutput|setErrorOutput)(\s)')
          # 注意3（第二个坑）：providers.exec 的 value-source 隔离机制要求 ExecSpec 参数
          # **可序列化**。cargokit 直接把 java.nio.file.Path / File 对象传给 executable /
          # environment / commandLine（旧 project.exec 会自动 toString，新 API 不会），
          # .result.get() 时抛 "Could not serialize value of type UnixPath/WindowsPath"。
          # 故对 cargokit 模板里固定的三个对象参数补 .toString()（模板固定，safe）。
          obj_to_string = [
              ('spec.executable path', 'spec.executable path.toString()'),
              ("spec.commandLine 'chmod', '+x', path",
               "spec.commandLine 'chmod', '+x', path.toString()"),
              ('"CARGOKIT_ROOT_PROJECT_DIR", rootProjectDir',
               '"CARGOKIT_ROOT_PROJECT_DIR", rootProjectDir.toString()'),
              ('"CARGOKIT_MANIFEST_DIR", manifestDir',
               '"CARGOKIT_MANIFEST_DIR", manifestDir.toString()'),
          ]
          def defang_object_args(body):
              for old, new in obj_to_string:
                  body = body.replace(old, new)
              return body
          def repl(m):
              body = m.group(1)
              if re.search(r'spec\s*->', body):
                  # 旧版补丁残留：body 已带 spec. 前缀，只需补 .result.get() 并修正对象参数
                  return 'project.providers.exec {' + defang_object_args(body) + '}.result.get()'
              new_lines = []
              for line in body.split('\n'):
                  new_lines.append(method_re.sub(r'\1spec.\2\3', line))
              return 'project.providers.exec { spec ->' + defang_object_args('\n'.join(new_lines)) + '}.result.get()'
          gs_re = re.compile(r'\$\{[^}]*\}')
          for path in glob.glob(os.path.join(pub_cache_dir, '**', 'cargokit*', 'gradle', 'plugin.gradle'), recursive=True):
              found += 1
              with open(path, 'r', encoding='utf-8') as f:
                  src = f.read()
              if '.result.get()' in src and 'executable path.toString()' in src:
                  continue  # 已是最终形式（providers.exec + result.get() + toString），跳过
              if '.result.get()' in src:
                  # 兼容上一轮残留产物：已有 providers.exec { ... }.result.get() 但缺
                  # .toString()（否则序列化错误再次出现）。只需补对象参数的 toString，
                  # 结构已是终态，无需经 pattern 重构。
                  new_src = defang_object_args(src)
                  if 'path.toString()' not in new_src or new_src == src:
                      print(f"!! 上轮残留升级失败，结构不符: {path}")
                      sys.exit(1)
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(new_src)
                  patched += 1
                  print(f"upgraded legacy result.get() -> +toString: {path}")
                  continue
              # 屏蔽 GString 的 ${...} 花括号，避免正则 [^{}]* 提前断裂、漏改关键构建块
              protected_src = gs_re.sub(lambda mm: '\x00' + mm.group(0)[2:-1] + '\x00', src)
              new_protected, n = pattern.subn(repl, protected_src)
              if n == 0:
                  # 文件存在但闭包结构已变化，无法自动修补：显式失败，避免后续在
                  # Gradle 深处报一个莫名其妙的 "Could not find method exec()"。
                  print(f"!! cargokit plugin.gradle 结构已变化，无法自动修补: {path}")
                  sys.exit(1)
              # 还原 ${...}
              new_src = re.sub('\x00([^\x00]*)\x00', lambda mm: '${' + mm.group(1) + '}', new_protected)
              if '.result.get()' not in new_src or 'spec.' not in new_src:
                  print(f"!! 修补后未见 result.get()/spec. 调用，疑似正则失效: {path}")
                  sys.exit(1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(new_src)
              patched += n
              print(f"patched ({n} exec blocks): {path}")
          if found == 0:
              print("!! 未在 pub 缓存中找到任何 cargokit plugin.gradle，无法修补 Gradle 9 兼容问题")
              sys.exit(1)
          if patched == 0:
              print("cargokit plugin.gradle 已包含 Gradle 9 兼容写法（无需修补）")
          else:
              print(f"共修补 {patched} 处 cargokit exec 调用")
          PY
      - name: 修补插件 JVM target 一致性问题（Kotlin 2.2+ fatal diagnostic）
        # Kotlin 2.2+ 把「Java 与 Kotlin 编译 target 不一致」从警告升级为致命错误：
        #   Inconsistent JVM-target compatibility detected for tasks
        #   'compileReleaseJavaWithJavac' (11) and 'compileReleaseKotlin' (1.8).
        # flutter_js 0.8.7 只设了 kotlinOptions { jvmTarget = 1.8 }、没设 compileOptions，
        # Java 侧用 AGP/Flutter 默认（11），两边不一致即 FAIL。这里给这类插件补一个与
        # 其 jvmTarget 匹配的 compileOptions（Java 也编译到 1.8），让两边对齐。
        # 通用处理：遍历 pub 缓存所有插件 android/build.gradle，凡有 kotlinOptions.jvmTarget
        # 但 android 块里没有 compileOptions 的，就补上。幂等：已有 compileOptions 则跳过。
        # 仅改 pub 缓存，不触碰仓库源码；上游发布修复后可移除本步。
        shell: bash
        run: |
          set -euo pipefail
          export PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          python3 - <<'PY'
          import glob, os, re, sys
          patched = 0
          found = 0
          pub_cache_dir = os.environ.get('PUB_CACHE_DIR') or os.environ.get('PUB_CACHE') or os.path.expanduser('~/.pub-cache')
          # 匹配 kotlinOptions { ... jvmTarget = ... } 块，并提取 JavaVersion 常量（如 VERSION_1_8）
          ko_re = re.compile(r'kotlinOptions\s*\{[^{}]*?jvmTarget\s*=\s*(?:JavaVersion\.)?(VERSION_\d+(?:_\d+)?)(?:\.toString\(\))?[^{}]*\}', re.S)
          for path in glob.glob(os.path.join(pub_cache_dir, '**', '*', 'android', 'build.gradle'), recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  src = f.read()
              if 'compileOptions' in src:
                  continue  # 已有 Java target 设置（无论是否与 Kotlin 一致都由作者负责），跳过
              m = ko_re.search(src)
              if not m:
                  continue  # 没设 jvmTarget 或结构不符，不需要处理
              found += 1
              version = m.group(1)  # 形如 VERSION_1_8
              # 在匹配到的 kotlinOptions 块所在行之前插入 compileOptions（与 jvmTarget 同版本），
              # 复用该行的缩进，保证插入位置准确。
              line_start = src.rfind('\n', 0, m.start()) + 1
              indent = re.match(r'[ \t]*', src[line_start:]).group(0)
              insert = (
                  f"{indent}compileOptions {{\n"
                  f"{indent}    sourceCompatibility JavaVersion.{version}\n"
                  f"{indent}    targetCompatibility JavaVersion.{version}\n"
                  f"{indent}}}\n"
              )
              new_src = src[:line_start] + insert + src[line_start:]
              if 'compileOptions' not in new_src:
                  print(f"!! 无法插入 compileOptions: {path}")
                  sys.exit(1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(new_src)
              patched += 1
              print(f"patched JVM target ({version}): {path}")
          if found == 0:
              print("未发现需要修补 JVM target 的插件（上游可能已修复）")
          else:
              print(f"共修补 {patched} 个插件的 JVM target")
          PY
      - name: 生成多语言文件 (gen-l10n)
        run: |
          flutter gen-l10n 2>&1
          echo "== generated l10n files =="
          ls -la lib/generated 2>&1 || true
          grep -n "class AppLocalizations" lib/generated/app_localizations.dart 2>&1 || true
      - name: 重新生成启动图标 (flutter_launcher_icons)
        # 源图：assets/icon/icon.png（含 adaptive_icon_background 蓝青主色 #0EA5E9）。
        # flutter_launcher_icons 不会在 `flutter build` 时自动重跑，故这里显式生成，
        # 保证每次构建都基于源图产出最新图标（含自适应图标，Android 12+ 莫奈取色生效）。
        run: flutter pub run flutter_launcher_icons 2>&1 || dart run flutter_launcher_icons 2>&1
      - name: 还原签名 keystore（从 Secrets）
        # keystore 与签名密码已不入库：ANDROID_KEYSTORE_BASE64 为 jks 文件的 base64，
        # 其余三项为签名凭据。Secrets 缺失（如 fork PR）时跳过，
        # build.gradle.kts 会自动回落 debug 签名，保证仍可编译。
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret 未配置，跳过（将回落 debug 签名）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=app/upload-keystore.jks"
          } > android/key.properties
          echo "keystore 与 key.properties 已还原"
      - name: 编译 APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --verbose --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} 2>&1 | tee apk_build.log || { echo "=== ANDROID BUILD FAILED ===" && tail -n 500 apk_build.log; exit 1; }
      - name: 编译通用 APK（fat，单文件全架构）
        # 与上方 --split-per-abi 分包并存：本步产出 app-release.apk（一个包适配所有 ABI），
        # 方便不想按架构挑包的用户直接安装。产物同样落在 build/app/outputs/flutter-apk/，
        # 由下方通配 *.apk 一并上传。
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --verbose --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} 2>&1 | tee apk_fat_build.log || { echo "=== ANDROID FAT APK BUILD FAILED ===" && tail -n 500 apk_fat_build.log; exit 1; }
      - name: 校验 ECH 引擎已打包 (libechproxy.so)
        # 三个 ABI 的 jniLibs/libechproxy.so 均已入库、Gradle 自动打包（现状无此 bug）。
        # 此校验防回归：若未来 jniLibs 被误删/被 abiFilters 过滤，这里显式失败而不是
        # 静默发布 ECH 不可用的 APK。fat APK 含全 ABI，分包 APK 各含其一，逐一检查。
        shell: bash
        run: |
          set -e
          missing=0
          for apk in build/app/outputs/flutter-apk/*.apk; do
            if ! unzip -l "$apk" | grep -q "libechproxy.so"; then
              echo "!! $apk 缺少 libechproxy.so（ECH 本地引擎未打包）"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "== flutter-apk 目录内容 =="
            ls -la build/app/outputs/flutter-apk/
            exit 1
          fi
          echo "全部 APK 均含 libechproxy.so"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop
      - name: 获取依赖
        run: flutter pub get 2>&1
      - name: 生成多语言文件 (gen-l10n)
        shell: bash
        run: |
          flutter gen-l10n 2>&1
          echo "== generated l10n files =="
          ls -la lib/generated 2>&1 || true
          grep -n "class AppLocalizations" lib/generated/app_localizations.dart 2>&1 || true
      - name: 重新生成启动图标 (flutter_launcher_icons)
        # 源图：assets/icon/icon.png（含 adaptive_icon_background 蓝青主色 #0EA5E9）。
        # 确保 Windows 也用上自定义图标（覆盖仓库里那份旧的 Flutter 默认 logo），
        # 同时重新生成 Android 自适应图标资源。每次构建都基于源图重新生成。
        run: flutter pub run flutter_launcher_icons 2>&1 || dart run flutter_launcher_icons 2>&1
      - name: 编译 Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --verbose --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} 2>&1 | tee win_build.log || { echo "=== WINDOWS BUILD FAILED ===" && tail -n 200 win_build.log; exit 1; }
      - name: 校验 ECH 本地引擎已打包 (echproxy.dll)
        # windows/CMakeLists.txt 的 install 规则若因 DLL 缺失被跳过，flutter build
        # 不会报错（v27 及以前的 CI 产物就是这样静默丢了 ECH 引擎，本地因 cargo
        # 产物存在而正常）。这里显式校验 Release 产物里有 echproxy.dll，缺失即失败，
        # 避免再次静默发布无引擎的包（zip 与 Inno Setup 安装包都基于同一 Release 目录）。
        shell: bash
        run: |
          set -e
          DLL="build/windows/x64/runner/Release/echproxy.dll"
          if [ ! -f "$DLL" ]; then
            echo "!! Release 产物缺少 echproxy.dll（ECH 本地引擎未打包）"
            echo "== Release 目录内容 =="
            ls -la build/windows/x64/runner/Release/
            exit 1
          fi
          echo "echproxy.dll 已打包: $(du -h "$DLL" | cut -f1)"
      - name: 打包 Windows 安装文件
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "NexHub-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: NexHub-windows-x64.zip
          if-no-files-found: error
      - name: 计算版本号（去掉 v 前缀，供安装包使用）
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: 打包 Windows 安装包 (Inno Setup -> exe)
        # 脚本：windows/installer/NexHub.iss；MyAppVersion 由 /D 传入（已去 v）。
        # 图标用上一步 flutter_launcher_icons 重新生成的自定义 app_icon.ico。
        # 用 Chocolatey 装 Inno Setup 后直接调 ISCC.exe（不依赖第三方 action 仓库，
        # 避免 minissoftware/Inno-Setup-Action 仓库不存在导致 Windows 构建失败）。
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          choco install innosetup -y
          New-Item -ItemType Directory -Force -Path windows/installer/Output | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found at $iscc - Inno Setup 安装失败或路径不同"
            exit 1
          }
          # 提前校验中文语言文件存在，避免 ISCC 编译到一半才因缺文件 abort（报错难定位）
          $isl = "windows\installer\Languages\ChineseSimplified.isl"
          if (-not (Test-Path $isl)) {
            Write-Error "缺少安装包中文语言文件: $isl"
            Write-Host "windows/installer 目录内容："
            Get-ChildItem -Path windows/installer -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          & $iscc "windows/installer/NexHub.iss" "/DMyAppVersion=$env:VERSION"
          # ISCC 可能把 exe 写到仓库根 Output/ 或 windows/installer/Output/（取决于 OutputDir 解析），
          # 兜底：两个位置都找，找到就复制到 windows/installer/Output（上传步骤期望的位置）
          $expectedDirs = @('windows\installer\Output', 'Output')
          $out = $null
          foreach ($d in $expectedDirs) {
            if (Test-Path $d) {
              $files = Get-ChildItem -Path $d -Filter *.exe -Recurse -ErrorAction SilentlyContinue
              if ($files -and $files.Count -gt 0) { $out = $files[0]; break }
            }
          }
          if (-not $out) {
            Write-Error "ISCC 未产出安装包 exe（windows/installer/Output 与 Output 下均未找到 *.exe）"
            Write-Host "windows/installer 目录内容："
            Get-ChildItem -Path windows/installer -Recurse | ForEach-Object { Write-Host $_.FullName }
            Write-Host "根目录 Output 目录内容："
            if (Test-Path Output) { Get-ChildItem -Path Output -Recurse | ForEach-Object { Write-Host $_.FullName } }
            exit 1
          }
          # 守卫复制：源与目标相同时（OutputDir 已直接写到 windows/installer/Output）跳过，
          # 避免 PowerShell 报 "Cannot overwrite the item ... with itself" 导致 step 失败。
          # 关键：目标路径也要转成绝对路径再比，否则相对路径 vs 绝对路径比较永远不相等。
          $destDir = "windows/installer/Output"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $destPathFull = [System.IO.Path]::GetFullPath((Join-Path $destDir $out.Name))
          if (-not (Test-Path $out.FullName)) {
            Write-Error "Expected installer not found: $($out.FullName)"
            exit 1
          }
          Write-Host "Source: $($out.FullName)"
          Write-Host "Dest  : $destPathFull"
          if ($out.FullName -ieq $destPathFull) {
            Write-Host "Installer already in destination: $destPathFull — skipping copy"
          } else {
            Write-Host "Copying installer $($out.FullName) -> $destDir"
            try {
              Copy-Item -Path $out.FullName -Destination $destDir -Force -ErrorAction Stop
            } catch {
              Write-Warning "Failed to copy installer: $($_.Exception.Message) — continuing if benign overwrite"
              throw
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/installer/Output/*.exe
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 编译依赖（更完整）
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libportal-dev libnotify-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxcomposite-dev libxdamage-dev libxtst-dev \
            libatk1.0-dev libcups2-dev \
            libasound2-dev libxss1 libpulse-dev libspeechd-dev \
            libglu1-mesa-dev libgl1-mesa-dev libegl1-mesa-dev \
            libwebkit2gtk-4.1-dev libjsoncpp-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - name: 启用 Linux 桌面支持
        run: flutter config --enable-linux-desktop
      - name: 确保 Linux 桌面工程存在（缺失则生成）
        run: |
          set -e
          if [ -f linux/CMakeLists.txt ]; then
            echo "Linux 桌面工程已存在，跳过生成"
          else
            echo "缺失 linux/CMakeLists.txt，重新生成 Linux 桌面工程"
            ICON=linux/flutter/icons.png
            [ -f "$ICON" ] && cp "$ICON" /tmp/nexhub_icon.png || true
            rm -rf linux
            flutter create --platforms=linux .
            [ -f /tmp/nexhub_icon.png ] && cp /tmp/nexhub_icon.png linux/flutter/icons.png || true
          fi
          echo "== linux/ 结构 =="
          ls -la linux

      - name: 关闭第三方插件上的 -Werror（新版 clang 兼容）
        # flutter create 生成的 CMakeLists 在 APPLY_STANDARD_SETTINGS 里给所有目标
        # （含 pub 插件）加 -Wall -Werror。新版 clang 会把旧版 nlohmann/json.hpp
        # 的 `operator "" _json` 判为 -Wdeprecated-literal-operator 并直接终止编译
        # （flutter_secure_storage_linux 自带该头文件）。发布构建不该被第三方
        # 插件的历史写法卡死，这里只去掉 -Werror，保留 -Wall 输出警告。
        run: |
          set -e
          for F in linux/CMakeLists.txt linux/runner/CMakeLists.txt; do
            if [ -f "$F" ] && grep -q -- '-Werror' "$F"; then
              sed -i 's/ -Werror//g' "$F"
              echo "patched $F"
              grep -n -- '-Wall' "$F" | head -3 || true
            fi
          done

      - name: 重新生成启动图标 (flutter_launcher_icons)
        # 覆盖 flutter create 生成的默认 Logo（仓库里 linux/ 被简化、没有 runner/，
        # flutter create 会放 Flutter 默认 Logo 当应用图标；这里用 NexHub 自定义图标覆盖）。
        run: flutter pub run flutter_launcher_icons 2>&1 || dart run flutter_launcher_icons 2>&1
      - name: Flutter 环境与诊断 (debug)
        run: |
          echo "FLUTTER_ROOT: ${FLUTTER_ROOT:-<unset>}"
          flutter --version
          flutter doctor -v || true
          uname -a
          lsb_release -a || true
      - name: Precache Flutter Linux 产物
        run: flutter precache --linux
      - name: 清理旧缓存（置于 pub get 之前，安全）
        run: flutter clean || true
      - name: 获取依赖 (verbose + 重试)
        run: |
          set -eux
          if flutter pub get; then
            echo "pub get succeeded"
          else
            echo "pub get 失败，改用 verbose 输出重试..."
            flutter pub get --verbose > pubget.log 2>&1 || true
            tail -n 500 pubget.log
            exit 1
          fi
      - name: 生成多语言文件 (gen-l10n)
        run: |
          flutter gen-l10n 2>&1
          echo "== generated l10n files =="
          ls -la lib/generated 2>&1 || true
          grep -n "class AppLocalizations" lib/generated/app_localizations.dart 2>&1 || true
      - name: 编译 Linux (verbose + 日志)
        run: |
          set -o pipefail
          flutter build linux --release --verbose --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} 2>&1 | tee flutter_build.log || { tail -n 500 flutter_build.log; exit 1; }
      - name: 上传构建日志 (始终，便于失败排查)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-flutter-build-log
          path: flutter_build.log
          if-no-files-found: ignore
      - name: 打包 Linux 安装文件
        run: tar -czf NexHub-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: NexHub-linux-x64.tar.gz
          if-no-files-found: error
      - name: 计算版本号（去掉 v 前缀，供 deb/AppImage 使用）
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: 打包 Linux .deb 安装包
        # 用 dpkg-deb 把 release bundle 打成 deb：opt/nexhub 放整套产物，
        # /usr/bin/nexhub 软链到可执行，附带 desktop 入口与图标。
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          BUNDLE=build/linux/x64/release/bundle
          STAGE=nexhub-deb
          rm -rf "$STAGE"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/opt/nexhub" "$STAGE/usr/bin" \
                   "$STAGE/usr/share/applications" \
                   "$STAGE/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE/." "$STAGE/opt/nexhub/"
          ln -s /opt/nexhub/nexhub "$STAGE/usr/bin/nexhub"
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: nexhub
          Version: ${VERSION}
          Section: multimedia
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libmpv1 | libmpv2, libsecret-1-0, libjsoncpp25, libglu1-mesa, libpulse0, libasound2, libnotify4
          Maintainer: NexHub <noreply@nexhub.app>
          Description: NexHub - 媒体聚合客户端（动漫/漫画/小说/影视）
           一款插件驱动的跨模块媒体聚合客户端。
          EOF
          cat > "$STAGE/usr/share/applications/nexhub.desktop" <<'EOF'
          [Desktop Entry]
          Name=NexHub
          Comment=媒体聚合客户端（动漫/漫画/小说/影视）
          Exec=/opt/nexhub/nexhub
          Icon=nexhub
          Type=Application
          Categories=AudioVideo;Video;Utility;
          Terminal=false
          EOF
          if [ -f assets/icon/icon.png ]; then
            cp assets/icon/icon.png "$STAGE/usr/share/icons/hicolor/256x256/apps/nexhub.png"
          fi
          dpkg-deb --build "$STAGE" "NexHub-linux-x64.deb"
          ls -la NexHub-linux-x64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: NexHub-linux-x64.deb
          if-no-files-found: error
      - name: 打包 Linux .AppImage（best-effort）
        # 用 linuxdeploy + flutter 插件把 bundle 打成 AppImage。该步骤依赖外部下载，
        # 失败仅警告、不阻断发布（仍保留 tar.gz 与 deb）。
        # 历史坑（v2.0.0-beta.2 实测 exit code 8）：
        #   GitHub ubuntu 运行实例默认未装 libfuse2，linuxdeploy / 插件 AppImage 自挂载失败；
        #   且原脚本 --plugin flutter 主命令失败后，兜底命令未加 || 容错，set -e 直接中断
        #   整个 Linux job、连带阻断 release。现改为：装 libfuse2 + 全程 --appimage-extract-and-run
        #   规避 FUSE，整体 set +e 且末尾 exit 0，确保 AppImage 打不出也不影响发布。
        shell: bash
        run: |
          set -e
          BUNDLE=build/linux/x64/release/bundle
          APPDIR=AppDir
          rm -rf "$APPDIR" NexHub-linux-x64.AppImage appimage_build.log
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE/." "$APPDIR/usr/bin/"
          cat > "$APPDIR/usr/share/applications/nexhub.desktop" <<'EOF'
          [Desktop Entry]
          Name=NexHub
          Comment=媒体聚合客户端（动漫/漫画/小说/影视）
          Exec=nexhub
          Icon=nexhub
          Type=Application
          Categories=AudioVideo;Video;Utility;
          Terminal=false
          EOF
          if [ -f assets/icon/icon.png ]; then
            cp assets/icon/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/nexhub.png"
          fi
          # AppImage 运行需要 libfuse2（ubuntu 22.04+ 默认未装），装不上也不致命
          sudo apt-get install -y libfuse2 2>&1 | tail -n 5 || true
          # flutter bundle 已是自包含 ELF + 资源，无需 linuxdeploy-plugin-flutter。
          # 该 continuous 插件返回空 --plugin-api-version，会报 "Could not find plugin: flutter"，故弃用。
          # 直接用 linuxdeploy --output appimage 打包；linuxdeploy 产出文件名形如
          # NexHub-x86_64.AppImage，统一重命名为工作流期望的 NexHub-linux-x64.AppImage。
          export PATH="$PWD:$PATH"
          set +e
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage --appimage-extract-and-run --appdir "$APPDIR" --output appimage > appimage_build.log 2>&1
          RC=$?
          set -e
          # linuxdeploy 产出文件名不确定（通常 NexHub-x86_64.AppImage），统一重命名为预期名
          if [ ! -f NexHub-linux-x64.AppImage ]; then
            SRC=$(ls NexHub-*.AppImage 2>/dev/null | head -n1)
            if [ -n "$SRC" ]; then
              mv "$SRC" NexHub-linux-x64.AppImage
            fi
          fi
          if [ -f NexHub-linux-x64.AppImage ]; then
            echo "AppImage 已产出："
            ls -la NexHub-linux-x64.AppImage
          else
            echo "AppImage 未产出（best-effort 跳过，不阻断发布），rc=$RC"
            echo "== appimage_build.log 末尾 =="
            tail -n 60 appimage_build.log 2>/dev/null || true
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage-log
          path: appimage_build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: NexHub-linux-x64.AppImage
          if-no-files-found: warn

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - name: 启用 macOS 桌面支持
        run: flutter config --enable-macos-desktop
      - name: 清理旧缓存（强制重建 Pods，确保部署目标 10.15 生效）
        run: flutter clean || true
      - name: 获取依赖
        run: flutter pub get 2>&1
      - name: 生成多语言文件 (gen-l10n)
        run: |
          flutter gen-l10n 2>&1
          echo "== generated l10n files =="
          ls -la lib/generated 2>&1 || true
          grep -n "class AppLocalizations" lib/generated/app_localizations.dart 2>&1 || true
      - name: 重新生成启动图标 (flutter_launcher_icons)
        # 用 assets/icon/icon.png 重新生成 macOS AppIcon.appiconset，
        # 避免仓库里 commit 的旧图标（与源图不一致）。
        run: flutter pub run flutter_launcher_icons 2>&1 || dart run flutter_launcher_icons 2>&1
      - name: 编译 macOS
        shell: bash
        run: |
          set -o pipefail
          flutter build macos --release --verbose --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} 2>&1 | tee macos_build.log || { echo "=== MACOS BUILD FAILED ===" && tail -n 500 macos_build.log; exit 1; }
      - name: 打包 macOS 安装文件
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)
          echo "找到 App: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" NexHub-macos.zip
      - name: 打包 macOS .dmg 安装镜像
        # 用 hdiutil 把 .app 打成 dmg，与 zip 并存，方便双击挂载安装。
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)
          echo "找到 App: $APP"
          hdiutil create -volname NexHub -srcfolder "$APP" -ov -format UDZO NexHub-macos.dmg
          ls -la NexHub-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: NexHub-macos.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: NexHub-macos.dmg
          if-no-files-found: error

  ios:
    name: iOS (无签名)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - name: 启用 iOS 支持
        run: flutter config --enable-ios
      - name: 清理旧缓存（强制重建 Pods）
        run: flutter clean || true
      - name: 校验 iOS 工程文件（Podfile 随仓库提交）
        # Podfile 已入库，直接校验存在性；不再现场 flutter create 生成
        # （那会覆写 Runner.xcodeproj 的包名与工程配置）。
        shell: bash
        run: |
          set -e
          test -f ios/Podfile || { echo "::error::缺少 ios/Podfile"; exit 1; }
          echo "ios/Podfile 就绪"
          ls -la ios

      - name: 获取依赖
        run: flutter pub get 2>&1
      - name: 生成多语言文件 (gen-l10n)
        run: |
          flutter gen-l10n 2>&1
          echo "== generated l10n files =="
          ls -la lib/generated 2>&1 || true
          grep -n "class AppLocalizations" lib/generated/app_localizations.dart 2>&1 || true
      - name: 重新生成启动图标 (flutter_launcher_icons)
        # 用 assets/icon/icon.png 重新生成 iOS AppIcon.appiconset。
        run: flutter pub run flutter_launcher_icons 2>&1 || dart run flutter_launcher_icons 2>&1
      - name: 编译 iOS（无签名）
        # --no-codesign：跳过代码签名，产出未签名的 Runner.app。
        # 未签名 IPA 无法直接装入非越狱真机，仅作构建产物/自签分发使用。
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --verbose --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} 2>&1 | tee ios_build.log || { echo "=== IOS BUILD FAILED ===" && tail -n 500 ios_build.log; exit 1; }
      - name: 校验 Runner.app 已产出
        shell: bash
        run: |
          set -e
          APP=build/ios/iphoneos/Runner.app
          if [ ! -d "$APP" ]; then
            echo "!! 未找到 $APP"
            echo "== build/ios 结构 =="
            find build/ios -maxdepth 3 -type d | head -n 40
            exit 1
          fi
          echo "Runner.app 已产出: $(du -sh "$APP" | cut -f1)"
      - name: 打包未签名 IPA
        # 未签名无法走 `flutter build ipa` 的 export 流程（export 需 team/签名），
        # 故手动把 Runner.app 塞进 Payload/ 并 zip 成标准 .ipa（自签/越狱侧载用）。
        shell: bash
        run: |
          set -e
          ROOT="$PWD"
          APP_DIR="$ROOT/build/ios/iphoneos"
          rm -rf "$APP_DIR/Payload" "$ROOT/NexHub-ios.ipa"
          mkdir -p "$APP_DIR/Payload"
          cp -r "$APP_DIR/Runner.app" "$APP_DIR/Payload/"
          # zip 在 Payload 同级目录执行，产物落在 APP_DIR；随后移回仓库根，
          # 与下方 upload-artifact 的 path 保持一致。
          ( cd "$APP_DIR" && zip -qr NexHub-ios.ipa Payload )
          mv "$APP_DIR/NexHub-ios.ipa" "$ROOT/NexHub-ios.ipa"
          ls -la "$ROOT/NexHub-ios.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: NexHub-ios.ipa
          if-no-files-found: error

  release:
    name: 发布到 GitHub Releases
    # 注意：鸿蒙 HAP 不在下方 files 清单里——它由并行的 build_ohos.yml 追加到同一条
    # Release（跨 workflow 无法用 needs 汇总，故两条工作流各自 append 同一 Release）。
    needs: [android, windows, linux, macos, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: NexHub ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-build/NexHub-windows-x64.zip
            artifacts/windows-installer/NexHub-setup-*.exe
            artifacts/linux-build/NexHub-linux-x64.tar.gz
            artifacts/linux-deb/NexHub-linux-x64.deb
            artifacts/linux-appimage/NexHub-linux-x64.AppImage
            artifacts/macos-build/NexHub-macos.zip
            artifacts/macos-dmg/NexHub-macos.dmg
            artifacts/ios-build/NexHub-ios.ipa
