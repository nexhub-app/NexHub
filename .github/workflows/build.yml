# =============================================================================
# NexHub 自动打包 + 发布工作流（v30 — 全平台统一发布到同一个 Release）
# -----------------------------------------------------------------------------
# 触发：推送 v* 标签自动发布；也支持网页手动 Run workflow 试跑。
#       任何 v* 标签都会构建全部平台（Android / Windows / Linux / macOS / iOS），
#       产物统一发布到该标签对应的**同一个** GitHub Release；
#       鸿蒙 HAP 由 build_ohos.yml 并行构建后追加到同一个 Release（不再单独发布）。
#
